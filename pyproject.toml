[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anythingintopdfbot"
version = "0.1.0"
description = "FastAPI service for converting uploaded images, PDFs, and text to PDF"
requires-python = ">=3.10"
dependencies = [
  "cairosvg>=2.7.0",
  "fastapi>=0.115.0",
  "gunicorn>=22.0.0",
  "jinja2>=3.1.4",
  "openpyxl>=3.1.0",
  "pillow>=10.4.0",
  "pillow-heif>=0.21.0",
  "pydantic>=2.7.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "python-pptx>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
