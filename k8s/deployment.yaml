apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingintopdfbot
  labels:
    app: anythingintopdfbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anythingintopdfbot
  template:
    metadata:
      labels:
        app: anythingintopdfbot
    spec:
      containers:
        - name: anythingintopdfbot
          image: anythingintopdfbot:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anythingintopdfbot
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_BOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: anythingintopdfbot
                  key: TELEGRAM_BOT_USERNAME
                  optional: true
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: anythingintopdfbot
                  key: TELEGRAM_WEBHOOK_SECRET
                  optional: true
